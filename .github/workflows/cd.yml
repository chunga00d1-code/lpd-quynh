name: CI/CD Pipeline

on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]

# Push nhiều commit liên tiếp: chỉ chạy pipeline cho commit mới nhất.
# PR thì hủy run cũ đang chạy; push (có deploy) thì xếp hàng thay vì hủy giữa chừng
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # BƯỚC 1: KIỂM TRA CHẤT LƯỢNG CODE (Chạy cho cả Push và Pull Request)
  ci-checks:
    name: Step 1 - Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Chỉ build thử trên PR để bắt lỗi build (vinext/vite) trước khi merge.
      # Khi push thì bỏ qua vì Step 2 đã build trong Docker rồi — tránh build trùng
      - name: Build check (PR only)
        if: github.event_name == 'pull_request'
        run: npm run build

  # BƯỚC 2: BUILD DOCKER IMAGE (Chỉ chạy khi push/merge và Step 1 thành công)
  build-image:
    name: Step 2 - Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-checks
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Tên image trên registry bắt buộc viết thường; github.repository có chữ hoa
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Giải phóng ~25-30GB dung lượng runner (xóa toolchain không dùng đến)
      # để BuildKit đủ chỗ build image + chuẩn bị cache export
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache trên GHCR (không tính vào giới hạn 10GB GHA cache).
          # mode=max: export cả layer của builder stage — package-lock.json không
          # đổi thì lần build sau nhảy qua bước cài node_modules
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # BƯỚC 3: DEPLOY VPS (Chỉ chạy khi Step 2 thành công)
  # Yêu cầu: trên VPS đã có sẵn Docker network "default_network" và service
  # MongoDB đang chạy trong network đó (không tạo mongo service ở đây).
  deploy:
    name: Step 3 - Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # --- Triển khai lên Staging (nhánh develop) ---
      - name: Copy docker-compose.yml to Staging VPS
        if: github.ref_name == 'develop'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "docker-compose.yml"
          target: "/opt/luna-nail-studio/staging"

      - name: Deploy via SSH to Staging VPS
        if: github.ref_name == 'develop'
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: ENV_FILE_CONTENT,IMAGE_NAME
          script: |
            TARGET_DIR="/opt/luna-nail-studio/staging"
            IMAGE_TAG="develop"
            CONTAINER_NAME="luna-nail-studio-staging"

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo/ghi nội dung cấu hình từ GitHub Secrets vào file .env cục bộ
            # (ENV_FILE phải chứa MONGODB_URI trỏ tới service Mongo nội bộ đã có sẵn)
            echo "$ENV_FILE_CONTENT" > .env

            # Đảm bảo network nội bộ tồn tại (không tạo mongo service, chỉ đảm bảo network có sẵn)
            docker network inspect default_network >/dev/null 2>&1 || docker network create default_network

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Tải (pull) image mới trước khi tắt container cũ để giảm tối đa downtime
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose pull

            # Khởi động lại container mới (Docker compose tự động recreate và restart với downtime tối thiểu)
            IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose up -d --remove-orphans

            # Giải phóng dung lượng ổ đĩa bằng cách xóa các image dangling/rác cũ
            docker image prune -f

      # --- Triển khai lên Production (nhánh production) ---
      - name: Copy docker-compose.yml to Production VPS
        if: github.ref_name == 'production'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          source: "docker-compose.yml"
          target: "/opt/luna-nail-studio/production"

      - name: Deploy via SSH to Production VPS
        if: github.ref_name == 'production'
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_PROD }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          envs: ENV_FILE_CONTENT,IMAGE_NAME
          script: |
            TARGET_DIR="/opt/luna-nail-studio/production"
            IMAGE_TAG="production"
            CONTAINER_NAME="luna-nail-studio-production"

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo/ghi nội dung cấu hình từ GitHub Secrets vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đảm bảo network nội bộ tồn tại (không tạo mongo service, chỉ đảm bảo network có sẵn)
            docker network inspect default_network >/dev/null 2>&1 || docker network create default_network

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Tải (pull) image mới trước khi tắt container cũ để giảm tối đa downtime
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose pull

            # Khởi động lại container mới
            IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose up -d --remove-orphans

            # Giải phóng dung lượng ổ đĩa bằng cách xóa các image dangling/rác cũ
            docker image prune -f
